site_name: SAS Dev Ops with SASjs CLI
site_url: https://cli.sasjs.io
nav:
  - Home: index.md
  - Installation: installation.md
  - Artefacts: artefacts.md
  - Configuration:
      - SASjs Config File: sasjsconfig.md
      - SASjs Runner: runner.md
      - Git Hooks: githooks.md
      - ENV File: env.md
  - Commands:
      - sasjs add: add.md
      - sasjs auth: auth.md
      - sasjs build: build.md
      - sasjs cbd: cbd.md
      - sasjs compile: compile.md
      - sasjs context: context.md
      - sasjs create: create.md
      - sasjs deploy: deploy.md
      - sasjs doc: doc.md
      - sasjs flow: flow.md
      - sasjs folder: folder.md
      - sasjs fs: fs.md
      - sasjs init: init.md
      - sasjs job: job.md
      - sasjs lint: lint.md
      - sasjs run: run.md
      - sasjs request: request.md
      - sasjs servicepack: servicepack.md
      - sasjs snippets: snippets.md
      - sasjs test: test.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - codehilite
  - meta
  - toc:
      permalink: true

extra_css: ["font-awesome.css"]

plugins:
  - search

# Repository
repo_name: "cli.sasjs.io"
repo_url: "https://github.com/sasjs/cli.sasjs.io"

theme:
  name: material
  logo: "img/logo/favicon/32.png"
  palette:
    primary: "White"
    accent: "Amber"
  font:
    text: "Open Sans"
    code: "Ubuntu Mono"
  favicon: img/logo/favicon/32.ico
  custom_dir: "theme"
  highlightjs: true
  hljs_languages:
    - SAS
    - JavaScript
    - Bash
  extra:
    social:
      - icon: fontawesome/brands/linkedin
        link: https://linkedin.com/company/sasjs
        name: SASjs on LinkedIn
copyright: All rights reserved &copy;2026 Macro People Ltd.

# A page link or an anchor that does not resolve is reported as a warning,
# and `mkdocs build --strict` in CI turns a warning into a failure - so a dead
# link stops the build instead of shipping. Absolute links (the `/add` form the
# older pages use) are informational: they resolve on the live domain.
validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
  anchors: warn
