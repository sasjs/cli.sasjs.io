site_name: SASjs CLI
site_url: https://cli.sasjs.io
site_description: Build, test, document and deploy SAS projects to Viya, SAS 9 EBI and SASjs Server.

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Artefacts: artefacts.md
  - Configuration:
      - SASjs Config File: sasjsconfig.md
      - SASjs Runner: runner.md
      - ENV File: env.md
  - Commands:
      - sasjs add: add.md
      - sasjs auth: auth.md
      - sasjs build: build.md
      - sasjs cb: cb.md
      - sasjs cbd: cbd.md
      - sasjs compile: compile.md
      - sasjs context: context.md
      - sasjs create: create.md
      - sasjs db: db.md
      - sasjs deploy: deploy.md
      - sasjs doc: doc.md
      - sasjs flow: flow.md
      - sasjs folder: folder.md
      - sasjs fs: fs.md
      - sasjs help: help.md
      - sasjs init: init.md
      - sasjs job: job.md
      - sasjs lint: lint.md
      - sasjs run: run.md
      - sasjs request: request.md
      - sasjs servicepack: servicepack.md
      - sasjs snippets: snippets.md
      - sasjs test: test.md
      - sasjs version: version.md
      - sasjs web: web.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/html_fixes.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search

# Repository
# No repo_url: Material fetches api.github.com for the star count on every page,
# unauthenticated, which rate-limits and logs a console error. The repository is
# linked from the footer social icons and from the pages themselves.

theme:
  name: material
  custom_dir: "theme"
  language: en
  logo: img/logo/favicon/32.svg
  favicon: img/logo/favicon/32.ico
  # Fonts are self-hosted - see docs/stylesheets/extra.css and docs/assets/fonts.
  font: false
  # Black and yellow is the SASjs mark, drawn as a yellow S on a black tile, so
  # it reads on either banner. The banner follows the scheme: white in light,
  # near-black in dark.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow

# Social links are top level: `extra.social`, not `theme.extra.social`. Nested
# under theme they are silently ignored and the footer icons never render.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sasjs/cli
      name: sasjs/cli on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/sasjs
      name: SASjs on LinkedIn

copyright: All rights reserved &copy;2026 Macro People Ltd.

# A page link or an anchor that does not resolve is reported as a warning,
# and `mkdocs build --strict` in CI turns a warning into a failure - so a dead
# link stops the build instead of shipping. Absolute links (the `/add` form the
# older pages use) are informational: they resolve on the live domain.
validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
  anchors: warn
