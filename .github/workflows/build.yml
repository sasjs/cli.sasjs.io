name: Build docs

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the docs toolchain
        run: pip install -r requirements.txt

      - name: Generate the sasjsconfig schema page
        run: generate-schema-doc --config-file sasjsconfig-docs.yaml docs/sasjsconfig-schema.json docs/sasjsconfig.html

      - name: Build the site
        # Same command as the deploy, so a pull request cannot be green and the
        # push to master fail. --strict fails on a broken page link or anchor.
        run: mkdocs build --strict

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the release tool and audit what it brings
        # the dependency this repository has, checked where a version bump
        # travels: a pull request. `npm audit` has no production tree to speak for
        # here - nothing in this repository ships - and --omit=dev would skip the
        # only dependency there is, so both halves run: the audit, and the
        # assertion that the tool resolves to nothing of its own.
        run: |
          set -euo pipefail
          npm ci
          npm audit
          entry="$(node -p "JSON.stringify(require('./package-lock.json').packages['node_modules/@sasjs/release'] || null)")"
          if [ "$entry" = "null" ]; then
            echo "::error::@sasjs/release is not in package-lock.json - is it still a devDependency?"
            exit 1
          fi
          deps="$(node -p "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p.bundleDependencies)?p.bundleDependencies:Object.keys(p.bundleDependencies||{});[...Object.keys(p.dependencies||{}),...Object.keys(p.peerDependencies||{}),...Object.keys(p.optionalDependencies||{}),...b].join(', ')" "$entry")"
          if [ -n "$deps" ]; then
            echo "::error::@sasjs/release now depends on: $deps - decide what audits it before bumping"
            exit 1
          fi
          echo "@sasjs/release declares no dependencies"

      - name: Check the command reference against the CLI
        # Every command has a page, every nav command page names a real command,
        # and no page mentions a flag its command does not declare. The CLI
        # version is pinned so this job is about the pull request; the weekly
        # docs-drift workflow runs the same check against @latest.
        run: node scripts/check-cli-docs.mjs --cli-version 6.34.0

      - name: Serve the built site
        # Lighthouse needs HTTP, and the scores depend on the response headers a
        # real host sends, so serve with compression rather than reading files.
        run: |
          nohup npx --yes serve@14.2.4 -l 8787 --no-clipboard site > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8787/; then echo "site is up"; exit 0; fi
            sleep 1
          done
          echo "the static server did not start"; cat /tmp/serve.log; exit 1

      - name: Lighthouse
        # Scores the pages a reader lands on, and fails the pull request if any
        # of them drops: performance 90, accessibility 100, best practices and
        # SEO 95. The per-audit assertions beside those catch the specific
        # regressions this site has had (an unlabelled dialog, unsized images,
        # "click here" links) with a message that says what to fix.
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 14

